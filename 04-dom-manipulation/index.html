<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DOM Manipulation - Dynamic Styling and Events</title>
</head>
<body>
    <!-- Box 1: Will have size and background changed by JavaScript -->
    <div class="box">Box 1</div>
    
    <!-- Box 2: Clickable box that increases Box 3's opacity -->
    <div class="box2">Box 2 (Click to brighten Box 3)</div>
    
    <!-- Box 3: Opacity changes from clicks and periodic fade-in -->
    <div id="box3">Box 3</div>

    <script src="main.js"></script>
</body>
</html>
