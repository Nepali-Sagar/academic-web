<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="grid.css" />
    <title>CSS Grid Layout - 3x3 Grid Demo</title>
</head>
<body>
    <h1>CSS Grid Layout (3x3)</h1>
    
    <!-- Grid container with 9 items -->
    <section class="container">
        <!-- 3x3 grid items numbered 1-9 -->
        <section>1</section>
        <section>2</section>
        <section>3</section>

        <section>4</section>
        <section>5</section>
        <section>6</section>

        <section>7</section>
        <section>8</section>
        <section>9</section>
    </section>
</body>
</html>
