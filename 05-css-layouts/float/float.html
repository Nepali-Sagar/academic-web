<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="float.css" />
    <title>CSS Float Layout - Classic Two-Column Page</title>
</head>
<body>
    <!-- Header Section -->
    <header></header>

    <!-- Main Content Section with Two-Column Layout -->
    <section>
        <!-- Left sidebar floated left -->
        <div id="left-bar"></div>
        
        <!-- Right content area floated right -->
        <div id="right-bar"></div>
        
        <!-- Clear float to prevent overflow -->
        <div class="clear"></div>
    </section>

    <!-- Footer Section -->
    <footer></footer>
</body>
</html>
