<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="position.css" />
    <title>CSS Positioning - Absolute, Relative, Z-Index Demo</title>
</head>
<body>
    <!-- Header Section -->
    <header></header>

    <!-- Main Content Section with Positioned Elements -->
    <section>
        <!-- Left sidebar -->
        <div id="left-bar"></div>
        
        <!-- Right content area with overlapping positioned boxes -->
        <div id="right-bar">
            <!-- Absolutely positioned boxes that overlap -->
            <!-- Box 1: Red, rotated 10deg, z-index 3 (top) -->
            <div class="box1">Box-1</div>
            
            <!-- Box 2: Green, rotated 20deg, z-index 2 (middle) -->
            <div class="box2">Box-2</div>
            
            <!-- Box 3: Blue, rotated 30deg, z-index 1 (bottom) -->
            <div class="box3">Box-3</div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer></footer>
</body>
</html>
