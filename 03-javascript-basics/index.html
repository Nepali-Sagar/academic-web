<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>JavaScript Basics - Button Clicks and Box Movement</title>
</head>
<body>
    <main>
        <!-- Button to demonstrate onclick handler -->
        <button onclick="alertMessage()">Hello</button>
        
        <!-- Button with CSS class for styling -->
        <button class="btn">Home</button>
        
        <!-- Box that will be moved with arrow keys -->
        <div id="box"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
