<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Float Layout - Basic Web Page Structure</title>
</head>
<body>
    <!-- Header Section: Two columns using float layout -->
    <header>
        <div class="first-dev">First Dev</div>
        <div class="second-dev">Second Dev</div>
        <div class="clear"></div>
    </header>

    <!-- Navigation Section: Horizontal menu using inline-block -->
    <nav class="navigation">
        <ul>
            <li><a href="#">First Menu</a></li>
            <li><a href="#">Second Menu</a></li>
            <li><a href="#">Third Menu</a></li>
            <li><a href="#">Fourth Menu</a></li>
            <div class="clear"></div>
        </ul>
    </nav>

    <!-- Main Content Section: Two-column layout (sidebar + main) -->
    <section>
        <div id="left-bar">Left Bar Contents here</div>
        <div id="right-bar">Right Bar Contents here</div>
    </section>
    <div class="clear"></div>

    <!-- Footer Section -->
    <footer>Footer</footer>
</body>
</html>
